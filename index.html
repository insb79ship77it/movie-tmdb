<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 정보 모아보기 | TMDB Movie Hub</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard Variable", Pretendard, sans-serif; }
    body { background-color: #ffffff; color: #111827; line-height: 1.5; padding-bottom: 60px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    header { border-bottom: 1px solid #f3f4f6; padding: 20px 0; position: sticky; top: 0; background-color: #ffffff; z-index: 100; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #111827; text-decoration: none; }
    .search-box { display: flex; gap: 8px; flex: 1; max-width: 400px; }
    .search-input { width: 100%; padding: 10px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .search-btn { padding: 10px 20px; background-color: #111827; color: #ffffff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .nav-tabs { display: flex; gap: 12px; margin: 24px 0 32px 0; }
    .tab-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid #e5e7eb; background-color: #ffffff; color: #4b5563; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background-color: #111827; color: #ffffff; border-color: #111827; }
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .error-box { grid-column: 1 / -1; padding: 30px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #991b1b; text-align: center; }
    footer { margin-top: 60px; padding-top: 30px; border-top: 1px solid #f3f4f6; text-align: center; color: #9ca3af; font-size: 0.85rem; }
    .tmdb-attribution { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
    .tmdb-logo { height: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="#" class="logo" onclick="loadMovies('popular')">MOVIE HUB</a>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="영화 제목을 검색해보세요..." onkeyup="if(event.key==='Enter') searchMovie()">
        <button class="search-btn" onclick="searchMovie()">검색</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab(this, 'popular')">인기 영화</button>
      <button class="tab-btn" onclick="switchTab(this, 'now_playing')">현재 상영작</button>
      <button class="tab-btn" onclick="switchTab(this, 'top_rated')">최고 평점</button>
    </div>

    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 MOVIE HUB. All rights reserved.</p>
      <div class="tmdb-attribution">
        <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_2-d5371429c77363250007b21642e79406e234e4458572e07d73b2475735b01143.svg" alt="TMDB" class="tmdb-logo">
        <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
      </div>
    </div>
  </footer>

  <script>
    const TMDB_API_KEY = '8267254fc2c012376e2c66d7fea58385'; 
    const BASE_URL = 'https://api.themoviedb.org/3';

    document.addEventListener('DOMContentLoaded', () => {
      loadMovies('popular');
    });

    async function loadMovies(type) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 40px; color:#6b7280;">데이터를 가져오는 중...</p>';
      
      try {
        const url = `${BASE_URL}/movie/${type}?api_key=${TMDB_API_KEY}&language=ko-KR&page=1`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`서버 응답 오류 (상태 코드: ${response.status})`);
        }

        const data = await response.json();
        
        if (!data.results || data.results.length === 0) {
          grid.innerHTML = '<div class="error-box">가져온 영화 데이터가 없습니다.</div>';
          return;
        }

        // 정상 출력 테스트용
        grid.innerHTML = `<div style="grid-column:1/-1; padding:20px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; color:#166534;">성공적으로 데이터를 불러왔습니다! 영화 개수: ${data.results.length}개</div>`;

      } catch (error) {
        console.error(error);
        grid.innerHTML = `
          <div class="error-box">
            <strong>데이터를 불러오지 못했습니다. (오류 발생)</strong><br>
            <p style="margin-top: 8px; font-family: monospace;">${error.message}</p>
          </div>
        `;
      }
    }

    function switchTab(btn, type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadMovies(type);
    }
  </script>
</body>
</html>
